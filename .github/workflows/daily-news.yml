name: Daily AI News Collection

on:
  schedule:
    - cron: '0 1 * * *'  # UTC 01:00 = Taiwan/Malaysia time 09:00 (UTC+8)
  workflow_dispatch:       # Allow manual trigger for testing

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Daily News Collection
        run: |
          echo "Triggering news collection at $(date -u)"
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.VERCEL_APP_URL }}/api/cron/daily-digest")
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "News collection failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "News collection completed successfully"

      - name: Log Result
        run: |
          echo "Daily news collection triggered at $(date -u)"
          echo "Next run: tomorrow at UTC 01:00 (Taiwan/Malaysia 09:00)"
