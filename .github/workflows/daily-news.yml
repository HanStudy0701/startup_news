name: Daily AI News Collection

on:
  schedule:
    - cron: '0 1 * * *'  # UTC 01:00 = Taiwan/Malaysia time 09:00 (UTC+8)
  workflow_dispatch:
    inputs:
      date:
        description: 'Backfill date (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Daily News Collection
        run: |
          DATE_PARAM="${{ github.event.inputs.date }}"
          if [ -n "$DATE_PARAM" ]; then
            URL="${{ secrets.VERCEL_APP_URL }}/api/cron/daily-digest?date=${DATE_PARAM}"
            echo "Backfill mode: targeting $DATE_PARAM"
          else
            URL="${{ secrets.VERCEL_APP_URL }}/api/cron/daily-digest"
            echo "Triggering news collection at $(date -u)"
          fi

          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "$URL")
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "News collection failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Completed successfully"

      - name: Log Result
        run: |
          echo "Triggered at $(date -u)"
          echo "Next scheduled run: UTC 01:00 daily (Taiwan/Malaysia 09:00)"
